<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUHK 校巴少边形路线图</title>
  <style>
    :root {
      color-scheme: light;
      --cuhk-purple: #4f2068;
      --cuhk-purple-2: #6f3fa0;
      --cuhk-gold: #d7a82f;
      --ink: #241331;
      --muted: #6f6475;
      --paper: #fffaf0;
      --panel: rgba(255, 255, 255, 0.92);
      --line-bg: #f5ead4;
      --border: rgba(79, 32, 104, 0.16);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 0%, rgba(215, 168, 47, 0.2), transparent 34%),
        linear-gradient(145deg, #fff8e9 0%, #f8f1df 42%, #efe2c4 100%);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding: 18px 22px 12px;
      border-bottom: 1px solid rgba(79, 32, 104, 0.12);
      background: rgba(255, 250, 240, 0.82);
      backdrop-filter: blur(16px);
    }

    .title-block h1 {
      margin: 0;
      font-size: clamp(20px, 2.6vw, 34px);
      line-height: 1.08;
      letter-spacing: 0;
      color: var(--cuhk-purple);
    }

    .title-block p {
      margin: 8px 0 0;
      max-width: 780px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      max-width: 720px;
    }

    .toolbar-break {
      flex-basis: 100%;
      height: 0;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--cuhk-purple);
      border-radius: 999px;
      min-height: 34px;
      padding: 7px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(79, 32, 104, 0.06);
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: rgba(79, 32, 104, 0.3);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
      transform: none;
    }

    button.is-active {
      background: var(--route-color, var(--cuhk-purple));
      border-color: var(--route-color, var(--cuhk-purple));
      color: var(--route-text, #fff);
    }

    button.is-focused {
      box-shadow:
        0 0 0 3px rgba(215, 168, 47, 0.28),
        0 10px 28px rgba(79, 32, 104, 0.12);
    }

    .control-button {
      background: var(--cuhk-purple);
      border-color: var(--cuhk-purple);
      color: #fff;
    }

    .control-button.is-secondary {
      background: #fff;
      border-color: rgba(79, 32, 104, 0.18);
      color: var(--cuhk-purple);
    }

    .control-button.is-secondary.is-active {
      background: var(--cuhk-purple);
      border-color: var(--cuhk-purple);
      color: #fff;
    }

    .diagram-shell {
      position: relative;
      min-height: 0;
      padding: 16px;
    }

    .diagram-card {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(79, 32, 104, 0.14);
      border-radius: 18px;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(79, 32, 104, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(79, 32, 104, 0.04) 1px, transparent 1px),
        rgba(255, 253, 247, 0.82);
      background-size: 48px 48px;
      box-shadow: 0 28px 80px rgba(79, 32, 104, 0.12);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 0;
      aspect-ratio: 1020 / 680;
    }

    .route-halo {
      stroke: rgba(255, 250, 240, 0.86);
      stroke-width: 7.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .route-line {
      stroke-width: 4.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      pointer-events: none;
      transition: opacity 0.16s ease, stroke-width 0.16s ease;
    }

    .route-line:hover,
    .route-line.is-focused {
      stroke-width: 7;
    }

    .route-hit {
      fill: none;
      stroke: transparent;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      pointer-events: stroke;
    }

    .route-line.is-muted,
    .route-halo.is-muted,
    .route-hit.is-muted,
    .route-strip-label.is-muted,
    .route-strip-service.is-muted,
    .route-stop-dot.is-muted,
    .route-stop-label.is-muted {
      opacity: 0.16;
    }

    .route-strip-label,
    .route-strip-service {
      display: none;
    }

    .route-strip-label {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0;
      pointer-events: none;
    }

    .route-strip-service {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 700;
      pointer-events: none;
    }

    .route-stop-dot {
      stroke: #fffefa;
      stroke-width: 2;
      cursor: pointer;
      filter: drop-shadow(0 2px 4px rgba(36, 19, 49, 0.14));
    }

    .route-stop-dot--bundle {
      stroke: rgba(36, 19, 49, 0.34);
      stroke-width: 2.2;
    }

    .route-stop-dot.is-selected {
      stroke: var(--cuhk-purple);
      stroke-width: 3;
    }

    .route-stop-label {
      fill: var(--ink);
      font-size: 7px;
      font-weight: 900;
      letter-spacing: 0;
      pointer-events: none;
    }

    .station-hit {
      fill: transparent;
      stroke: transparent;
      cursor: pointer;
    }

    .station-shield {
      fill: #fffdf7;
      stroke: none;
      pointer-events: none;
    }

    .station-ring {
      fill: #fffefa;
      stroke: var(--cuhk-purple);
      stroke-width: 3;
      filter: drop-shadow(0 4px 10px rgba(79, 32, 104, 0.18));
      transition: width 0.16s ease, height 0.16s ease, stroke 0.16s ease, fill 0.16s ease;
    }

    .station-route-anchor {
      stroke: #fffefa;
      stroke-width: 1.8;
      filter: drop-shadow(0 2px 4px rgba(36, 19, 49, 0.18));
      pointer-events: none;
    }

    .station-node.is-hub .station-ring {
      stroke-width: 4;
    }

    .station-node.is-selected .station-ring {
      fill: #fff5c8;
      stroke: var(--cuhk-gold);
    }

    .station-node.is-route-end .station-ring {
      fill: #eaf8f7;
      stroke: #2f7f88;
    }

    .station-node.is-muted {
      opacity: 0.2;
    }

    .station-label {
      fill: var(--cuhk-purple);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      pointer-events: none;
    }

    .station-label.is-small {
      font-size: 10px;
      font-weight: 800;
    }

    .station-label.is-vertical {
      font-size: 10px;
    }

    .station-label.is-vertical.is-small {
      font-size: 9px;
    }

    .panel {
      position: absolute;
      left: 20px;
      bottom: 20px;
      width: min(420px, calc(100% - 40px));
      border: 1px solid rgba(79, 32, 104, 0.16);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(79, 32, 104, 0.16);
      padding: 16px;
    }

    .panel-title {
      margin: 0;
      color: var(--cuhk-purple);
      font-size: 18px;
      line-height: 1.2;
    }

    .panel-body {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .route-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }

    .route-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 9px;
      background: #fff;
      border: 1px solid rgba(79, 32, 104, 0.12);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .route-chip::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--route-color);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    .stats {
      position: absolute;
      right: 18px;
      top: 18px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: min(420px, calc(100% - 40px));
      pointer-events: none;
    }

    .stat-pill {
      border: 1px solid rgba(79, 32, 104, 0.14);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      backdrop-filter: blur(12px);
    }

    @media (max-width: 840px) {
      .app {
        grid-template-rows: auto minmax(0, 1fr);
      }

      .topbar {
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 10px 10px 8px;
      }

      .title-block h1 {
        font-size: 18px;
      }

      .title-block p {
        display: none;
      }

      .toolbar {
        flex-wrap: nowrap;
        justify-content: flex-start;
        max-width: 100%;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }

      .toolbar::-webkit-scrollbar {
        display: none;
      }

      .toolbar-break {
        display: none;
      }

      button {
        flex: 0 0 auto;
        min-height: 32px;
        padding: 6px 10px;
        font-size: 12px;
      }

      .diagram-shell {
        padding: 8px;
      }

      .diagram-card {
        min-height: calc(100vh - 92px);
        border-radius: 14px;
      }

      svg {
        height: calc(100vh - 92px);
        min-height: 560px;
      }

      .panel {
        left: 10px;
        right: 10px;
        bottom: 10px;
        width: auto;
        padding: 12px;
      }

      .panel-title {
        font-size: 15px;
      }

      .panel-body {
        font-size: 12px;
        line-height: 1.38;
      }

      .route-chip-row {
        max-height: 74px;
        overflow-y: auto;
      }

      .stats {
        display: none;
      }
    }
  </style>
</head>

          routes: manualRouteStops,

        LAYOUT_CENTER[0] + (coord[0] - LAYOUT_CENTER[0]) * LAYOUT_SCALE_X,

    function ensurePositions() {
      const missing = new Set();
      routes.forEach((route) => {
        route.stops.forEach((stopId) => {
          if (!POSITIONS[stopId]) missing.add(stopId);
        });
      });
      if (!missing.size) return;

      const coords = [...missing].map((id) => stops[id] && stops[id].coord).filter(Boolean);
      const allCoords = Object.values(stops).map((stop) => stop.coord).filter(Boolean);
      const lonValues = allCoords.map((coord) => coord[0]);
      const latValues = allCoords.map((coord) => coord[1]);
      const minLon = Math.min(...lonValues);
      const maxLon = Math.max(...lonValues);
      const minLat = Math.min(...latValues);
      const maxLat = Math.max(...latValues);
      coords.forEach((coord, index) => {
        const id = [...missing][index];
        const x = 180 + ((coord[0] - minLon) / (maxLon - minLon || 1)) * 840;
        const y = 760 - ((coord[1] - minLat) / (maxLat - minLat || 1)) * 650;
        POSITIONS[id] = expandPoint([Math.round(x / 24) * 24, Math.round(y / 24) * 24]);
        POINTS[id] = POSITIONS[id];
      });
    }

      focusedRouteId = null;
      persistEditorState();
      rerenderEditor();
    }

    function restoreDefaultRoutes() {
      manualRouteStops = {};
      routeStripPositionOverrides = {};
      routeStripMergeAliases = {};
      routes.splice(0, routes.length, ...routeOrderIds(null)
        .map(routeForDiagramId)
        .filter(Boolean));
      activeRoutes.clear();
      routes.forEach((route) => activeRoutes.add(routeBaseId(route)));
      activeEditorRouteId = routes[0] ? routes[0].id : null;
      selectedStopId = null;
      focusedRouteId = null;
      persistEditorState();
      rerenderEditor();
    }

    function rerenderEditor() {
      stationConnectorDirectionCache.clear();
      renderToolbar();
      renderDiagram();
      renderInfoPanel();
      renderStats();
    }

    function renderDiagram() {
      diagram.innerHTML = "";
      const visibleRoutes = routes.filter(routeIsActive);
      if (ROUTE_STRIP_MODE) {
        renderRouteStripDiagram(visibleRoutes);
        return;
      }
      const bundleLayout = createBundleLayout(visibleRoutes);

      const haloLayer = svgEl("g", { class: "route-halo-layer" });
      const lineLayer = svgEl("g", { class: "route-line-layer" });
      const hitLayer = svgEl("g", { class: "route-hit-layer" });
      visibleRoutes.forEach((route) => {
        const d = routePathData(route, bundleLayout);
        if (!d) return;
        const muted = focusedRouteId && route.id !== focusedRouteId ? " is-muted" : "";
        haloLayer.append(svgEl("path", { d, class: `route-halo${muted}`, fill: "none" }));
        lineLayer.append(svgEl("path", {
          d,
          class: `route-line${focusedRouteId === route.id ? " is-focused" : ""}${muted}`,
          stroke: routeColor(route),
          fill: "none",
          "data-route-id": route.id
        }));
        const hit = svgEl("path", {
          d,
          class: `route-hit${muted}`,
          "data-route-id": route.id
        });
        hit.addEventListener("click", (event) => {
          event.stopPropagation();
          focusedRouteId = route.id;
          selectedStopId = null;
          renderToolbar();
          renderDiagram();
          renderInfoPanel();
        });
        hitLayer.append(hit);
      });

      const stationLayer = svgEl("g", { class: "station-layer" });
      visibleStationIds(visibleRoutes).forEach((stopId) => {
        const station = buildStationNode(stopId, visibleRoutes);
        stationLayer.append(station);
      });

      diagram.append(haloLayer, lineLayer, hitLayer, stationLayer);
      diagram.addEventListener("click", () => {
        selectedStopId = null;
        focusedRouteId = null;
        renderToolbar();
        renderDiagram();
        renderInfoPanel();
      }, { once: true });
    }

    function renderRouteStripDiagram(visibleRoutes) {
      const labelLayer = svgEl("g", { class: "route-strip-label-layer" });
      const haloLayer = svgEl("g", { class: "route-halo-layer" });
      const lineUnderLayer = svgEl("g", { class: "route-line-layer route-line-layer--under" });
      const lineLayer = svgEl("g", { class: "route-line-layer" });
      const hitLayer = svgEl("g", { class: "route-hit-layer" });
      const stopLayer = svgEl("g", { class: "route-strip-stop-layer" });
      const alignedStopColumns = routeStripAlignedStopColumns(visibleRoutes);

      visibleRoutes.forEach((route, routeIndex) => {
        const y = routeStripY(routeIndex, visibleRoutes.length, visibleRoutes);
        const stopIds = routeStopsForDiagram(route).filter((stopId) => stops[stopId]);
        const stopPositions = routeStripStopPositions(route, stopIds, alignedStopColumns, visibleRoutes);
        const routeExtent = routeStripExtent(stopPositions);
        const d = routeStripLinePath(y, stopPositions, 0) ||
          `M${rounded(routeExtent.start)},${rounded(y)} L${rounded(routeExtent.end)},${rounded(y)}`;
        const muted = focusedRouteId && route.id !== focusedRouteId ? " is-muted" : "";
        const color = routeColor(route);

        haloLayer.append(svgEl("path", { d, class: `route-halo${muted}`, fill: "none" }));
        const lineAttrs = {
          d,
          class: `route-line${focusedRouteId === route.id ? " is-focused" : ""}${muted}`,
          stroke: color,
          fill: "none",
          "data-route-id": route.id
        };
        lineUnderLayer.append(svgEl("path", lineAttrs));
        const topLinePath = routeStripLinePath(y, stopPositions, ROUTE_STRIP_LINE_STOP_CLEARANCE);
        if (topLinePath) lineLayer.append(svgEl("path", { ...lineAttrs, d: topLinePath }));

        const continuationPath = routeStripContinuationPath(route, routeIndex, y, stopPositions, alignedStopColumns, visibleRoutes);
        if (continuationPath) {
          haloLayer.append(svgEl("path", { d: continuationPath, class: `route-halo${muted}`, fill: "none" }));
          lineUnderLayer.append(svgEl("path", { ...lineAttrs, d: continuationPath }));
          lineLayer.append(svgEl("path", { ...lineAttrs, d: continuationPath }));
        }

        const hit = svgEl("path", {
          d,
          class: `route-hit${muted}`,
          "data-route-id": route.id
        });
        hit.addEventListener("click", (event) => {
          event.stopPropagation();
          focusedRouteId = route.id;
          selectedStopId = null;
          renderToolbar();
          renderDiagram();
          renderInfoPanel();
        });
        hitLayer.append(hit);

        appendRouteStripLabel(labelLayer, route, y, muted, visibleRoutes);
        appendRouteStripStops(stopLayer, labelLayer, route, y, muted, alignedStopColumns, stopIds, stopPositions, visibleRoutes);
      });

      diagram.append(haloLayer, lineUnderLayer, hitLayer, stopLayer, lineLayer, labelLayer);
      diagram.addEventListener("click", () => {
        selectedStopId = null;
        focusedRouteId = null;
        renderToolbar();
        renderDiagram();
        renderInfoPanel();
      }, { once: true });
    }

    function routeStripLinePath(y, stopPositions, clearance) {
      const parts = [];
      for (let index = 0; index < stopPositions.length - 1; index += 1) {
        const fromX = stopPositions[index];
        const toX = stopPositions[index + 1];
        if (!Number.isFinite(fromX) || !Number.isFinite(toX) || Math.abs(toX - fromX) < 0.1) continue;
        const direction = toX >= fromX ? 1 : -1;
        const gap = Math.min(clearance, Math.abs(toX - fromX) / 3);
        const startX = fromX + direction * gap;
        const endX = toX - direction * gap;
        if ((endX - startX) * direction <= 0) continue;
        parts.push(`M${rounded(startX)},${rounded(y)} L${rounded(endX)},${rounded(y)}`);
      }
      return parts.join(" ");
    }

    function routeStripContinuationPath(route, routeIndex, y, stopPositions, alignedStopColumns, visibleRoutes) {
      if (!routeIsSecondaryTableRow(route) || !stopPositions.length) return "";
      const baseId = routeBaseId(route);
      const previousIndex = visibleRoutes
        .slice(0, routeIndex)
        .map((candidate, index) => routeBaseId(candidate) === baseId ? index : -1)
        .filter((index) => index >= 0)
        .pop();
      if (!Number.isFinite(previousIndex)) return "";

      const previousRoute = visibleRoutes[previousIndex];
      const previousY = routeStripY(previousIndex, visibleRoutes.length, visibleRoutes);
      const previousStopIds = routeStopsForDiagram(previousRoute).filter((stopId) => stops[stopId]);
      const previousPositions = routeStripStopPositions(previousRoute, previousStopIds, alignedStopColumns, visibleRoutes);
      const fromX = previousPositions[previousPositions.length - 1];
      if (!Number.isFinite(fromX)) return "";

      const endpoints = [stopPositions[0], stopPositions[stopPositions.length - 1]].filter(Number.isFinite);
      if (!endpoints.length) return "";
      const toX = endpoints.reduce((best, x) => Math.abs(x - fromX) < Math.abs(best - fromX) ? x : best, endpoints[0]);
      return `M${rounded(fromX)},${rounded(previousY)} L${rounded(fromX)},${rounded(y)} L${rounded(toX)},${rounded(y)}`;
    }

    function appendRouteStripLabel(layer, route, y, muted, visibleRoutes) {
      if (routeIsSecondaryTableRow(route)) return;
      const laneRoutes = routeStripLaneRoutes(route, visibleRoutes);
      if (laneRoutes[0] && laneRoutes[0].id !== route.id) return;
      const label = svgEl("text", {
        class: `route-strip-label${muted}`,
        x: ROUTE_STRIP_X_START - 22,
        y: rounded(y - 3),
        "text-anchor": "end"
      });
      label.textContent = laneRoutes.length > 1 ? laneRoutes.map((laneRoute) => laneRoute.id).join(" / ") : `${route.id} ${route.name}`;
      layer.append(label);

      if (routeStripUsesBundledRows(visibleRoutes)) return;

      const service = svgEl("text", {
        class: `route-strip-service${muted}`,
        x: ROUTE_STRIP_X_START - 22,
        y: rounded(y + 12),
        "text-anchor": "end"
      });
      service.textContent = route.service || "";
      layer.append(service);
    }

    function appendRouteStripStops(layer, labelLayer, route, y, muted, alignedStopColumns, stopIds, stopPositions, visibleRoutes) {
      const occurrenceKeys = routeStripOccurrenceKeysForRoute(route, stopIds);
      stopIds.forEach((stopId, index) => {
        const x = stopPositions[index];
        const occurrenceKey = occurrenceKeys[index];
        const markerPlan = routeStripStopMarkerPlan(route, y, muted, stopIds, stopPositions, occurrenceKeys, index, visibleRoutes);
        if (markerPlan) {
          const marker = markerPlan.geometry;
          const selectedClass = selectedStopId === stopId ? " is-selected" : "";
        const dot = svgEl("rect", {
          class: `route-stop-dot${markerPlan.extraClass || ""}${selectedClass}${markerPlan.muted || ""}`,
          x: rounded(marker.x),
          y: rounded(marker.y),
          width: rounded(marker.width),
          height: rounded(marker.height),
          rx: rounded(marker.width / 2),
          ry: rounded(marker.width / 2),
          fill: markerPlan.fill,
          "data-route-id": markerPlan.routeId,
          "data-stop-id": stopId,
          "data-occurrence-key": occurrenceKey
        });
        dot.append(svgEl("title"));
        dot.querySelector("title").textContent = markerPlan.title;
        if (markerPlan.draggable) {
          dot.addEventListener("pointerdown", (event) => {
            beginRouteStripStopDrag(event, route.id, occurrenceKey, stopId, x);
          });
        }
        dot.addEventListener("click", (event) => {
          event.stopPropagation();
          if (suppressNextRouteStripClick) {
            suppressNextRouteStripClick = false;
            return;
          }
          selectedStopId = stopId;
          focusedRouteId = markerPlan.focusRouteId;
          renderToolbar();
          renderDiagram();
          renderInfoPanel();
        });
        layer.append(dot);
        appendRouteStripCapsuleLabel(labelLayer, markerPlan, stopId, selectedClass || markerPlan.muted || "");
        }
      });
    }

    function appendRouteStripCapsuleLabel(layer, markerPlan, stopId, extraClass) {
      if (!markerPlan || markerPlan.skip) return;
      const marker = markerPlan.geometry;
      const lines = routeStripCapsuleLabelLines(routeStopDisplayLabel(stopId));
      const centerX = marker.x + marker.width / 2;
      const centerY = marker.y + marker.height / 2;
      const text = svgEl("text", {
        class: `route-stop-label${extraClass || ""}`,
        x: rounded(centerX),
        y: rounded(centerY - (lines.length > 1 ? 3.5 : -2.5)),
        "text-anchor": "middle",
        "dominant-baseline": "middle",
        "data-route-id": markerPlan.routeId,
        "data-stop-id": stopId
      });
      lines.forEach((line, index) => {
        const tspan = svgEl("tspan", {
          x: rounded(centerX),
          dy: index === 0 ? 0 : 8
        });
        tspan.textContent = line;
        text.append(tspan);
      });
      layer.append(text);
    }

    function routeStripCapsuleLabelLines(label) {
      const chars = Array.from(label || "");
      if (chars.length <= 1) return [label || ""];
      const splitAt = Math.ceil(chars.length / 2);
      return [chars.slice(0, splitAt).join(""), chars.slice(splitAt).join("")];
    }

    function routeStripStopMarkerPlan(route, y, muted, stopIds, stopPositions, occurrenceKeys, index, visibleRoutes) {
      const stopId = stopIds[index];
      const x = stopPositions[index];
      const occurrenceKey = occurrenceKeys[index];
      const selected = selectedStopId === stopId;
      const combinedMarker = routeStripCombinedStopMarker(route, occurrenceKey, stopId, x, visibleRoutes, selected);
      if (combinedMarker && combinedMarker.skip) return null;
      if (combinedMarker) return combinedMarker;

      const draggable = routeStripIsBundleExtraStop(route, occurrenceKey, stopId) &&
        !ROUTE_STRIP_FIXED_EXTRA_STOP_KEYS.has(routeStripEditKey(route.id, occurrenceKey));

      return {
        geometry: routeStripStopMarkerGeometry(route, x, y, selected),
        fill: routeColor(route),
        routeId: route.id,
        focusRouteId: route.id,
        muted,
        draggable,
        title: `${route.id} · ${routeStopDisplayLabel(stopId)}`
      };
    }

    function routeStripCombinedStopMarker(route, occurrenceKey, stopId, x, visibleRoutes, selected) {
      if (!routeStripUsesBundledRows(visibleRoutes) || !routeStripIsBundledRoute(route)) return null;
      const mergeTargetKey = routeStripMergeTargetKey(route, occurrenceKey);
      if (mergeTargetKey && mergeTargetKey !== occurrenceKey) {
        const targetParticipants = routeStripBundledMarkerParticipants(mergeTargetKey, visibleRoutes);
        const targetRun = routeStripParticipantRun(targetParticipants, route.id, mergeTargetKey);
        return targetRun.length > 1 ? { skip: true } : null;
      }

      const participants = routeStripBundledMarkerParticipants(occurrenceKey, visibleRoutes);
      if (participants.length <= 1) return null;
      const mergedKey = mergeTargetKey || occurrenceKey;
      const participantRun = routeStripParticipantRun(participants, route.id, mergedKey);
      if (participantRun.length <= 1) return null;
      const combinesExtra = Boolean(mergeTargetKey) || participants.some((participant) => (
        participant.route.id !== route.id &&
        routeStripMergeTargetKey(participant.route, participant.occurrenceKey) === occurrenceKey
      ));
      if (routeStripIsBundleExtraStop(route, occurrenceKey, stopId) && !combinesExtra) return null;
      const owner = participantRun.find((participant) => participant.occurrenceKey === mergedKey) || participantRun[0];
      if (owner.route.id !== route.id) return { skip: true };

      const yValues = participantRun.map((participant) => participant.y);
      const topY = Math.min(...yValues);
      const bottomY = Math.max(...yValues);
      const width = selected ? 32 : 30;
      const padding = selected ? 11 : 9;
      const routeIds = participantRun.map((participant) => participant.route.id);
      const markerMuted = focusedRouteId && !routeIds.includes(focusedRouteId) ? " is-muted" : "";

      return {
        geometry: {
          x: x - width / 2,
          y: topY - padding,
          width,
          height: bottomY - topY + padding * 2
        },
        extraClass: " route-stop-dot--bundle",
        fill: "#fffefa",
        routeId: routeIds.join(" "),
        focusRouteId: null,
        muted: markerMuted,
        title: `${routeIds.join(" / ")} · ${routeStopDisplayLabel(stopId)}`
      };
    }

    function routeStripParticipantRun(participants, routeId, mergedKey) {
      const bridgedRoutes = ROUTE_STRIP_BRIDGED_MERGE_ROUTE_IDS[mergedKey];
      if (bridgedRoutes && bridgedRoutes.has(routeId)) {
        return participants.filter((participant) => bridgedRoutes.has(participant.route.id));
      }
      return ROUTE_STRIP_EXTENDED_MERGE_KEYS.has(mergedKey)
        ? participants
        : routeStripContiguousParticipantRun(participants, routeId);
    }

    function routeStripContiguousParticipantRun(participants, routeId) {
      const routeIndex = participants.findIndex((participant) => participant.route.id === routeId);
      if (routeIndex < 0) return [];
      let start = routeIndex;
      let end = routeIndex;
      while (start > 0 && participants[start].laneIndex - participants[start - 1].laneIndex <= 1) start -= 1;
      while (end + 1 < participants.length && participants[end + 1].laneIndex - participants[end].laneIndex <= 1) end += 1;
      return participants.slice(start, end + 1);
    }

    function routeStripBundledMarkerParticipants(occurrenceKey, visibleRoutes) {
      return visibleRoutes.map((route, routeIndex) => {
        if (!routeStripIsBundledRoute(route)) return null;
        const stopIds = routeStopsForDiagram(route).filter((stopId) => stops[stopId]);
        const occurrenceKeys = routeStripOccurrenceKeysForRoute(route, stopIds);
        const participantKey = occurrenceKeys.find((routeKey) => (
          routeKey === occurrenceKey || routeStripMergeTargetKey(route, routeKey) === occurrenceKey
        ));
        if (!participantKey) return null;
        return {
          route,
          routeIndex,
          laneIndex: routeStripLaneIndex(route, visibleRoutes),
          occurrenceKey: participantKey,
          y: routeStripY(routeIndex, visibleRoutes.length, visibleRoutes)
        };
      }).filter(Boolean).sort((a, b) => a.laneIndex - b.laneIndex || a.routeIndex - b.routeIndex);
    }

    function routeStripStopMarkerGeometry(route, x, y, selected) {
      const bundled = routeStripIsBundledRoute(route);
      const width = selected ? 30 : (bundled ? 28 : 30);
      const height = selected ? ROUTE_STRIP_BUNDLE_LANE_GAP + 7 : (bundled ? ROUTE_STRIP_BUNDLE_LANE_GAP + 3 : 18);
      return {
        x: x - width / 2,
        y: y - height / 2,
        width,
        height
      };
    }

    function routeStripY(routeIndex, routeCount, visibleRoutes) {
      if (routeStripUsesBundledRows(visibleRoutes)) {
        const route = visibleRoutes[routeIndex];
        const laneKeys = routeStripBundledLaneKeys(visibleRoutes);
        const laneIndex = Math.max(0, laneKeys.indexOf(routeStripLaneKey(route)));
        const blockHeight = (laneKeys.length - 1) * ROUTE_STRIP_BUNDLE_LANE_GAP;
        return ROUTE_STRIP_Y_CENTER - blockHeight / 2 + laneIndex * ROUTE_STRIP_BUNDLE_LANE_GAP;
      }
      if (routeCount <= 0) return ROUTE_STRIP_Y_START;
      const blockHeight = (routeCount - 1) * ROUTE_STRIP_LANE_GAP;
      return ROUTE_STRIP_Y_CENTER - blockHeight / 2 + routeIndex * ROUTE_STRIP_LANE_GAP;
    }

    function routeStripUsesBundledRows(visibleRoutes) {
      if (!Array.isArray(visibleRoutes) || visibleRoutes.length < 2) return false;
      const bundledRoutes = visibleRoutes.filter((route) => routeStripIsBundledRoute(route));
      if (ROUTE_STRIP_MODE && Object.keys(ROUTE_STRIP_TABLE_ROWS).length) return bundledRoutes.length >= 2;
      return bundledRoutes.length >= 2 && bundledRoutes.some((route) => route.id === ROUTE_STRIP_BUNDLE_BASE_ROUTE_ID);
    }

    function routeStripIsBundledRoute(route) {
      return Boolean(route && ROUTE_STRIP_BUNDLE_ROUTE_IDS.has(routeBaseId(route)));
    }

    function routeStripLaneKey(route) {
      return route ? (ROUTE_STRIP_SHARED_LANE_KEYS[route.id] || route.id) : "";
    }

    function routeStripBundledLaneKeys(visibleRoutes) {
      return visibleRoutes
        .filter((route) => routeStripIsBundledRoute(route))
        .reduce((keys, route) => {
          const laneKey = routeStripLaneKey(route);
          if (!keys.includes(laneKey)) keys.push(laneKey);
          return keys;
        }, []);
    }

    function routeStripLaneIndex(route, visibleRoutes) {
      return routeStripBundledLaneKeys(visibleRoutes).indexOf(routeStripLaneKey(route));
    }

    function routeStripLaneRoutes(route, visibleRoutes) {
      const laneKey = routeStripLaneKey(route);
      return visibleRoutes.filter((candidate) => routeStripLaneKey(candidate) === laneKey);
    }

    function routeStripBundledStopPositions(route, stopIds, visibleRoutes) {
      if (!routeStripUsesBundledRows(visibleRoutes) || !routeStripIsBundledRoute(route)) return null;
      const referenceRoute = visibleRoutes.find((candidate) => candidate.id === ROUTE_STRIP_BUNDLE_BASE_ROUTE_ID) || visibleRoutes[0];
      const referenceStopIds = routeStopsForDiagram(referenceRoute).filter((stopId) => stops[stopId]);
      const referenceKeys = routeStripOccurrenceKeysForRoute(referenceRoute, referenceStopIds);
      const routeKeys = routeStripOccurrenceKeysForRoute(route, stopIds);
      const referencePositionsByKey = new Map(referenceKeys.map((key, index) => [key, routeStripEvenX(index, referenceStopIds.length)]));
      const directPositions = stopIds.map((stopId, index) => {
        if (routeStripIsBundleExtraStop(route, routeKeys[index], stopId)) return NaN;
        const directPosition = referencePositionsByKey.get(routeKeys[index]);
        return Number.isFinite(directPosition) ? directPosition : NaN;
      });

      const positions = stopIds.map((stopId, index) => {
        if (Number.isFinite(directPositions[index])) return directPositions[index];
        const alignedExtraX = routeStripBundledExtraAlignedX(route, routeKeys[index], referencePositionsByKey);
        if (Number.isFinite(alignedExtraX)) return alignedExtraX;
        return routeStripBundledExtraStopX(routeKeys, referencePositionsByKey, index, stopIds.length, directPositions);
      });
      return positions;
    }

    function routeStripOccurrenceKeysForRoute(route, stopIds) {
      const tableCells = routeStripTableCells(route && route.id);
      if (tableCells && tableCells.length === stopIds.length && tableCells.every((cell, index) => cell.stopId === stopIds[index])) {
        return tableCells.map((cell) => `${cell.stopId}#col${cell.column + 1}`);
      }
      const overrides = route && ROUTE_STRIP_OCCURRENCE_KEY_OVERRIDES[route.id];
      const counts = {};
      return stopIds.map((stopId, index) => {
        const override = overrides && overrides[`${stopId}@${index}`];
        if (override) return override;
        counts[stopId] = (counts[stopId] || 0) + 1;
        return `${stopId}#${counts[stopId]}`;
      });
    }

    function routeStripOccurrenceKeys(stopIds) {
      const counts = {};
      return stopIds.map((stopId) => {
        counts[stopId] = (counts[stopId] || 0) + 1;
        return `${stopId}#${counts[stopId]}`;
      });
    }

    function routeStripIsBundleExtraStop(route, occurrenceKey, stopId) {
      if (routeStripTableCells(route && route.id)) return false;
      if (ROUTE_STRIP_BUNDLE_EXTRA_STOP_IDS.has(stopId)) return true;
      return Boolean(route && ROUTE_STRIP_BUNDLE_EXTRA_STOP_KEYS.has(`${route.id}|${occurrenceKey}`));
    }

    function routeStripEvenSmallStopRuns(route, stopIds, routeKeys, positions, visibleRoutes) {
      const result = positions.slice();
      for (let index = 0; index < stopIds.length; index += 1) {
        if (!routeStripIsSmallExtraStop(route, routeKeys[index], stopIds[index], visibleRoutes)) continue;
        const start = index;
        while (
          index + 1 < stopIds.length &&
          routeStripIsSmallExtraStop(route, routeKeys[index + 1], stopIds[index + 1], visibleRoutes)
        ) {
          index += 1;
        }
        const end = index;
        const previousIndex = start - 1;
        const nextIndex = end + 1;
        if (
          previousIndex < 0 ||
          nextIndex >= stopIds.length ||
          !Number.isFinite(result[previousIndex]) ||
          !Number.isFinite(result[nextIndex])
        ) {
          continue;
        }

        const step = (result[nextIndex] - result[previousIndex]) / (end - start + 2);
        for (let runIndex = start; runIndex <= end; runIndex += 1) {
          result[runIndex] = result[previousIndex] + step * (runIndex - start + 1);
        }
      }
      return result;
    }

    function routeStripIsSmallExtraStop(route, occurrenceKey, stopId, visibleRoutes) {
      return routeStripIsBundleExtraStop(route, occurrenceKey, stopId) &&
        !routeStripWillRenderBundle(route, occurrenceKey, stopId, visibleRoutes);
    }

    function routeStripWillRenderBundle(route, occurrenceKey, stopId, visibleRoutes) {
      const mergeTargetKey = routeStripMergeTargetKey(route, occurrenceKey);
      if (mergeTargetKey && mergeTargetKey !== occurrenceKey) {
        const targetRun = routeStripParticipantRun(
          routeStripBundledMarkerParticipants(mergeTargetKey, visibleRoutes),
          route.id,
          mergeTargetKey
        );
        return targetRun.length > 1;
      }

      const participants = routeStripBundledMarkerParticipants(occurrenceKey, visibleRoutes);
      if (participants.length <= 1) return false;
      const mergedKey = mergeTargetKey || occurrenceKey;
      const participantRun = routeStripParticipantRun(participants, route.id, mergedKey);
      if (participantRun.length <= 1) return false;
      const combinesExtra = Boolean(mergeTargetKey) || participants.some((participant) => (
        participant.route.id !== route.id &&
        routeStripMergeTargetKey(participant.route, participant.occurrenceKey) === occurrenceKey
      ));
      return !(routeStripIsBundleExtraStop(route, occurrenceKey, stopId) && !combinesExtra);
    }

    function routeStripBundledExtraAlignedX(route, occurrenceKey, referencePositionsByKey) {
      if (!route || !occurrenceKey) return NaN;
